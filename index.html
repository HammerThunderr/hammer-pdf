<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free PDF tools that run entirely in your browser. Merge, split, compress, convert, edit, sign and protect PDFs without uploading them.">
<title>Hammer PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Caveat:wght@600&family=Dancing+Script:wght@600&family=Homemade+Apple&display=swap">
<style>
/* Layout: a workshop pegboard. Home = tools hung in labelled racks by job; tool view = bench (files, pages) + side panel (settings, run, results). */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --sunk:#E6E8EC; --ink:#15181D; --muted:#596170; --line:#D6D9DF;
  --accent:#C9362A; --accent-ink:#FFFFFF; --focus:#2F6FD1;
  --c-organize:#DB4B37; --c-optimize:#4A9433; --c-to:#C98A0E; --c-from:#2F6FD1; --c-edit:#984891; --c-security:#2E4F87;
  --ok:#2C7A4B; --bad:#B42318; --add-bg:#DDF2E3; --del-bg:#FADFDB; --hl:#FFE14D;
  --f-display:"Archivo","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1A1D23; --sunk:#23272F; --ink:#ECEEF2; --muted:#9BA2AE; --line:#2D323B;
  --accent:#F0604D; --accent-ink:#16090A; --focus:#7AA7F0;
  --c-organize:#F0705C; --c-optimize:#77C25C; --c-to:#E8B041; --c-from:#6E9CF0; --c-edit:#C77CC0; --c-security:#7D9BD6;
  --ok:#6FCF97; --bad:#FF8A7A; --add-bg:#16351F; --del-bg:#3D1C19; --hl:#E8C930; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1A1D23; --sunk:#23272F; --ink:#ECEEF2; --muted:#9BA2AE; --line:#2D323B;
  --accent:#F0604D; --accent-ink:#16090A; --focus:#7AA7F0;
  --c-organize:#F0705C; --c-optimize:#77C25C; --c-to:#E8B041; --c-from:#6E9CF0; --c-edit:#C77CC0; --c-security:#7D9BD6;
  --ok:#6FCF97; --bad:#FF8A7A; --add-bg:#16351F; --del-bg:#3D1C19; --hl:#E8C930; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 72px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:4px 16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.word{font-family:var(--f-display);font-weight:850;font-stretch:118%;font-size:21px;letter-spacing:-.01em}
.word b{color:var(--accent);font-weight:850}
.privacy{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.privacy svg{width:15px;height:15px;color:var(--ok)}

.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-block:34px 8px}
.intro h1{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:110%;font-size:clamp(28px,4.6vw,48px);line-height:1.04;letter-spacing:-.022em;max-width:15ch;text-wrap:balance}
.intro p{margin:10px 0 0;color:var(--muted);max-width:52ch}
.search{position:relative;width:min(100%,320px)}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}

.rack{margin-top:30px}
.rack h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rack h2 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.rack h2 em{font-style:normal;font-family:var(--f-mono);letter-spacing:0;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.tile{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--c);transform:translateY(-1px)}
.tile b{display:block;font-weight:600}
.tile .tx span{display:block;margin-top:2px;font-size:13px;line-height:1.4;color:var(--muted)}
.ic{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.ic svg{width:21px;height:21px}
.empty-search{color:var(--muted);padding:30px 0}

.toolhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;padding-block:22px 18px}
.back{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:10px}
.back:hover{color:var(--ink)}
.toolhead .ic{width:48px;height:48px;border-radius:12px}
.toolhead .ic svg{width:26px;height:26px}
.toolhead h1{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:108%;font-size:clamp(24px,3.4vw,34px);line-height:1.1;letter-spacing:-.015em}
.toolhead p{grid-column:2;margin:2px 0 0;color:var(--muted)}

.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:880px){.bench{grid-template-columns:minmax(0,1fr)}}
.work{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);min-width:0}
@media (max-width:880px){.panel{position:static}}
.panel h2{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

.drop{position:relative;border:2px dashed var(--line);border-radius:12px;background:var(--surface);padding:38px 18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--c);background:color-mix(in srgb,var(--c) 6%,var(--surface))}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop .big{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;font-weight:600;padding:11px 20px;border-radius:9px}
.drop .big svg{width:18px;height:18px}
.drop small{display:block;margin-top:10px;color:var(--muted);font-size:13px}
.drop.compact{padding:10px 14px;text-align:left;display:flex;align-items:center;gap:12px}
.drop.compact .big{padding:7px 14px;font-size:14px}
.drop.compact small{margin:0}

.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}
.files .fi{width:30px;height:30px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--sunk);font:600 10px var(--f-mono);color:var(--muted);text-transform:uppercase}
.files .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .sz{color:var(--muted);font-size:12px}
.iconbtn{border:0;background:transparent;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--sunk);color:var(--ink)}
.iconbtn:disabled{opacity:.3;cursor:default;background:transparent}
.iconbtn svg{width:16px;height:16px}

.ws-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ws-bar .grow{flex:1;min-width:160px}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer}
.mini:hover{border-color:var(--muted)}
.mini:disabled{opacity:.4;cursor:default}
.loading{color:var(--muted);font-size:14px;padding:20px 0;display:flex;align-items:center;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--c);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.thumb{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;user-select:none;-webkit-user-select:none}
.thumb.sel{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.thumb.drag{opacity:.4}
.thumb.over{border-style:dashed;border-color:var(--c)}
.thumb .tc{aspect-ratio:5/6;display:grid;place-items:center;overflow:hidden;background:var(--sunk);border-radius:6px}
.thumb canvas{max-width:86%;max-height:86%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.thumb.del .tc canvas{opacity:.25}
.thumb .badge{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;display:none;place-items:center;background:var(--c);color:#fff}
.thumb .badge svg{width:14px;height:14px}
.thumb.sel .badge{display:grid}
.thumb.del .badge{display:grid;background:var(--bad)}
.thumb .tl{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
.thumb .tb{display:flex;gap:2px}
.thumb .tb .iconbtn{width:26px;height:26px}

.stage-wrap{background:var(--sunk);border-radius:12px;padding:14px;display:flex;justify-content:center;overflow:hidden}
.stage{position:relative;width:100%;max-width:880px;container-type:inline-size;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.stage canvas{display:block;width:100%;height:auto}
.layer{position:absolute;inset:0;cursor:crosshair;touch-action:none;overflow:hidden}
.it{position:absolute;cursor:move;touch-action:none}
.it .x{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:none;place-items:center;cursor:pointer;padding:0}
.it .x svg{width:12px;height:12px}
.it:hover .x,.it.act .x{display:grid}
.it-text{white-space:pre;line-height:1.2;font-family:Helvetica,Arial,sans-serif;outline:1px dashed rgba(47,111,209,.6);outline-offset:2px}
.it-whiteout{background:#fff;outline:1px dashed #888}
.it-highlight{background:rgba(255,225,77,.45)}
.it-rect{border:2px solid currentColor}
.it-redact{background:#000}
.it-crop{outline:9999px solid rgba(0,0,0,.45);border:2px dashed #fff;cursor:move}
.it-image img{width:100%;height:100%;display:block;pointer-events:none}
.it-image{outline:1px dashed rgba(47,111,209,.6)}
.ghost{position:absolute;border:2px dashed #2F6FD1;background:rgba(47,111,209,.12);pointer-events:none}

.fld{display:flex;flex-direction:column;gap:5px;font-size:13px}
.fld>span{color:var(--muted);font-weight:500}
.fld input[type=text],.fld input[type=password],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.fld textarea{min-height:76px;resize:vertical}
.fld input[type=color]{width:48px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.fld input[type=range]{width:100%;accent-color:var(--c)}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:14px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--c)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.hint.warn{color:var(--ink);background:color-mix(in srgb,var(--c-to) 16%,transparent);padding:9px 11px;border-radius:8px}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:7px 8px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
#sigpad{width:100%;height:auto;aspect-ratio:3/1;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair;display:block}
.sigprev{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:70px;display:grid;place-items:center;padding:6px}
.sigprev img{max-height:70px}

.run{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;padding:13px 16px;border-radius:10px;cursor:pointer;width:100%}
.run:hover{filter:brightness(1.06)}
.run:disabled{opacity:.55;cursor:progress}
.run.alt{background:var(--ink);color:var(--bg)}
.prog{display:flex;flex-direction:column;gap:7px;font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .2s}
.bar i.indet{width:35%!important;animation:indet 1.1s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.err{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--ink);border-radius:9px;padding:10px 12px;font-size:14px}
.err b{color:var(--bad)}
.results h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:7px;color:var(--ok)}
.results h3 svg{width:17px;height:17px}
.outs{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.outs li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:8px 8px 8px 11px;min-width:0}
.outs .on{flex:1;min-width:0}
.outs .fn{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.outs .sz{font-size:12px;color:var(--muted)}
.outs .note{display:block;font-size:12px;color:var(--muted)}
.dl{border:0;background:var(--c);color:#fff;font-weight:600;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;flex:none}
.preview{max-height:280px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 var(--f-mono);white-space:pre-wrap;word-break:break-word;margin:0}

.formlist{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.formlist .fld input,.formlist .fld select{max-width:520px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.notice b{color:var(--ink)}

.diff{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.diff h4{margin:0;padding:9px 14px;font-size:13px;background:var(--sunk);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.diff .dl-wrap{overflow-x:auto}
.diff p{margin:0;padding:3px 14px 3px 30px;font-size:13px;position:relative;white-space:pre-wrap;word-break:break-word}
.diff p::before{position:absolute;left:12px;font-family:var(--f-mono);color:var(--muted)}
.diff .a{background:var(--add-bg)}.diff .a::before{content:"+"}
.diff .r{background:var(--del-bg);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}.diff .r::before{content:"−"}
.diff .s{color:var(--muted);font-style:italic}
.sumrow{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.sumrow b{font-family:var(--f-mono)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#" aria-label="Hammer PDF home">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h9l3-3h3v6h-3l-3-3"/><path d="M9 9v11"/></svg></span>
      <span class="word">Hammer<b>PDF</b></span>
    </a>
    <span class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Files are processed on your device and never uploaded</span>
  </header>
  <main id="app"></main>
  <footer>Hammer PDF runs entirely in your browser. Office conversions, compression and OCR are best-effort and may not match desktop software exactly.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
'use strict';
const CDN = {
  pdflib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',
  pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfjsWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  html2canvas: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  pptx: 'https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js',
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'
};

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const xmlEsc = s => String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtSize = b => b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const baseName = n => n.replace(/\.[^.]+$/, '');
const tick = () => new Promise(r => setTimeout(r, 0));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hexRgb = hex => { const h = (hex || '#000000').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16); return PDFLib.rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); };
const WIN = new Set('€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ');
const winAnsi = s => String(s).replace(/\r/g, '').replace(/[^\n]/g, ch => { const c = ch.charCodeAt(0); return (c >= 32 && c < 127) || (c >= 160 && c <= 255) || WIN.has(ch) ? ch : '?'; });

let toastTimer;
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }

  const xfrmOf = el => { const sp = kid(el, 'p:spPr') || kid(el, 'p:grpSpPr'); const x = kid(sp, 'a:xfrm'); if (!x) return null; const o = kid(x, 'a:off'), e = kid(x, 'a:ext'); if (!o || !e) return null; const r = { x: +o.getAttribute('x'), y: +o.getAttribute('y'), w: +e.getAttribute('cx'), h: +e.getAttribute('cy') }; const co = kid(x, 'a:chOff'), ce = kid(x, 'a:chExt'); if (co && ce) { r.cx = +co.getAttribute('x'); r.cy = +co.getAttribute('y'); r.cw = +ce.getAttribute('cx') || 1; r.ch = +ce.getAttribute('cy') || 1; } return r; };
  const phOf = el => { const nv = kid(el, 'p:nvSpPr') || kid(el, 'p:nvPicPr'); const ph = desc(nv, 'p:ph'); return ph ? { type: ph.getAttribute('type') || 'body', idx: ph.getAttribute('idx') || '' } : null; };
  const colorOf = el => { const c = desc(el, 'a:srgbClr'); return c ? '#' + c.getAttribute('val') : null; };
  async function phMap(doc) {
    const m = {}; if (!doc) return m;
    for (const sp of doc.getElementsByTagName('p:sp')) { const ph = phOf(sp), x = xfrmOf(sp); if (ph && x) { m['t:' + ph.type] ||= x; if (ph.idx) m['i:' + ph.idx] ||= x; } }
    return m;
  }
  const bgOf = doc => { const bg = desc(doc, 'p:bg'); if (!bg) return null; const pr = kid(bg, 'p:bgPr'); const sf = pr && kid(pr, 'a:solidFill'); return sf ? colorOf(sf) : null; };
  for (let si = 0; si < slides.length; si++) {
    progress(`Rendering slide ${si + 1} of ${slides.length}`, si / slides.length);
    const path = slides[si];
    const sx = await rd(path); if (!sx) continue;
    const srels = await relsOf(path);
    const layoutPath = Object.values(srels).find(r => r.type.endsWith('/slideLayout'))?.target;
    const layout = layoutPath ? await rd(layoutPath) : null;
    const lrels = layoutPath ? await relsOf(layoutPath) : {};
    const masterPath = Object.values(lrels).find(r => r.type.endsWith('/slideMaster'))?.target;
    const master = masterPath ? await rd(masterPath) : null;
    const lmap = await phMap(layout), mmap = await phMap(master);
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = bgOf(sx) || bgOf(layout) || bgOf(master) || '#ffffff'; ctx.fillRect(0, 0, W, H);
    const media = {};
    const loadImg = async rid => {
      const t = srels[rid]?.target; if (!t) return null;
      if (t in media) return media[t];
      const f = zip.file(t); if (!f) return (media[t] = null);
      try { media[t] = await createImageBitmap(await f.async('blob')); } catch (e) { media[t] = null; }
      return media[t];
    };
    const drawText = (txBody, box, ph) => {
      const bodyPr = kid(txBody, 'a:bodyPr');
      const anchor = bodyPr?.getAttribute('anchor') || (ph && /title/i.test(ph.type) ? 'ctr' : 't');
      const fit = desc(bodyPr, 'a:normAutofit'); const fscale = fit && fit.getAttribute('fontScale') ? +fit.getAttribute('fontScale') / 100000 : 1;
      const ins = k => +(bodyPr?.getAttribute(k) ?? (k === 'lIns' || k === 'rIns' ? 91440 : 45720)) * s;
      const bx = box.x + ins('lIns'), bw = Math.max(10, box.w - ins('lIns') - ins('rIns'));
      const defSize = ph ? (ph.type === 'title' || ph.type === 'ctrTitle' ? 40 : ph.type === 'subTitle' ? 24 : 22) : 18;
      const isBody = ph && (ph.type === 'body' || ph.type === 'obj');
      const lines = [];
      for (const p of kids(txBody, 'a:p')) {
        const pPr = kid(p, 'a:pPr');
        const algn = pPr?.getAttribute('algn') || (ph && ph.type === 'ctrTitle' ? 'ctr' : 'l');
        const lvl = +(pPr?.getAttribute('lvl') || 0);
        const runs = [];
        for (const r of p.children) {
          if (r.nodeName === 'a:r' || r.nodeName === 'a:fld') {
            const rPr = kid(r, 'a:rPr'), t = kid(r, 'a:t');
            runs.push({ text: t ? t.textContent : '', size: (rPr?.getAttribute('sz') ? +rPr.getAttribute('sz') / 100 : defSize) * fscale, bold: rPr?.getAttribute('b') === '1', color: colorOf(kid(rPr, 'a:solidFill')) || null });
          } else if (r.nodeName === 'a:br') runs.push({ br: true });
        }
        const text = runs.map(r => r.br ? '\n' : r.text).join('');
        const first = runs.find(r => !r.br) || { size: defSize * fscale };
        const bullet = isBody && text.trim() && !desc(pPr, 'a:buNone');
        const px = first.size * 12700 * s;
        ctx.font = `${first.bold ? '700 ' : ''}${px}px Arial, Helvetica, sans-serif`;
        const indent = (lvl * 0.4 * 72 * 12700 * s) + (bullet ? px * 0.9 : 0);
        const avail = bw - indent;
        const segs = text.split('\n');
        let firstLine = true;
        for (const seg of segs) {
          const words = seg.split(/(\s+)/); let line = '';
          const push = l => { lines.push({ text: l, px, bold: first.bold, color: first.color, algn, indent, bullet: bullet && firstLine }); firstLine = false; };
          for (const w of words) { const test = line + w; if (ctx.measureText(test).width > avail && line.trim()) { push(line.trimEnd()); line = w.trimStart(); } else line = test; }
          push(line);
        }
        if (!text) lines.push({ text: '', px, algn, indent: 0 });
      }
      const total = lines.reduce((a, l) => a + l.px * 1.2, 0);
      let y = box.y + ins('tIns');
      if (anchor === 'ctr') y = box.y + (box.h - total) / 2; else if (anchor === 'b') y = box.y + box.h - ins('bIns') - total;
      ctx.textBaseline = 'alphabetic';
      for (const l of lines) {
        ctx.font = `${l.bold ? '700 ' : ''}${l.px}px Arial, Helvetica, sans-serif`;
        ctx.fillStyle = l.color || '#1a1a1a';
        const tw = ctx.measureText(l.text).width;
        let x = bx + l.indent;
        if (l.algn === 'ctr') x = bx + (bw - tw) / 2; else if (l.algn === 'r') x = bx + bw - tw;
        const base = y + l.px * 0.95;

        ctx.fillText(l.text, x, base);
        y += l.px * 1.2;
      }
    };
    const walk = async (tree, tf) => {
      for (const el of tree.children) {
        const n = el.nodeName;
        if (n === 'p:grpSp') {
          const x = xfrmOf(el);
          const inner = x && x.cw ? (r => tf({ x: x.x + (r.x - x.cx) * x.w / x.cw, y: x.y + (r.y - x.cy) * x.h / x.ch, w: r.w * x.w / x.cw, h: r.h * x.h / x.ch })) : tf;
          await walk(el, inner); continue;
        }
        if (n !== 'p:sp' && n !== 'p:pic') continue;
        const ph = phOf(el);
        let x = xfrmOf(el);
        if (!x && ph) x = lmap['i:' + ph.idx] || lmap['t:' + ph.type] || mmap['t:' + ph.type] || (ph.type === 'body' || ph.type === 'obj' ? (lmap['t:body'] || mmap['t:body']) : null);
        if (!x) continue;
        const r = tf(x); const box = { x: r.x * s, y: r.y * s, w: r.w * s, h: r.h * s };
        if (n === 'p:pic') {
          const blip = desc(el, 'a:blip'); const img = blip && await loadImg(blip.getAttribute('r:embed'));
          if (img) ctx.drawImage(img, box.x, box.y, box.w, box.h);

        }
        const spPr = kid(el, 'p:spPr');
        const fill = kid(spPr, 'a:solidFill');
        if (fill && colorOf(fill)) { ctx.fillStyle = colorOf(fill); ctx.fillRect(box.x, box.y, box.w, box.h); }
        const blipFill = kid(spPr, 'a:blipFill'); if (blipFill) { const b = desc(blipFill, 'a:blip'); const img = b && await loadImg(b.getAttribute('r:embed')); if (img) ctx.drawImage(img, box.x, box.y, box.w, box.h); }
        const tx = kid(el, 'p:txBody'); if (tx) drawText(tx, box, ph);
      }
    };
    const tree = desc(sx, 'p:spTree');
    if (tree) await walk(tree, r => r);
    const img = await pdf.embedJpg(await canvasBytes(cv, 'image/jpeg', 0.9));
    const pw = CX / 12700, ph = CY / 12700;
    pdf.addPage([pw, ph]).drawImage(img, { x: 0, y: 0, width: pw, height: ph });
  }
  return pdf;
}

/* ---------- line diff ---------- */
function diffLines(a, b) {
  const n = a.length, m = b.length;
  if (n * m > 3e6) { const sb = new Set(b), sa = new Set(a); return [...a.map(s => ({ t: sb.has(s) ? '=' : '-', s })), ...b.filter(s => !sa.has(s)).map(s => ({ t: '+', s }))]; }
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const res = []; let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] === b[j]) { res.push({ t: '=', s: a[i] }); i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) res.push({ t: '-', s: a[i++] }); else res.push({ t: '+', s: b[j++] }); }
  while (i < n) res.push({ t: '-', s: a[i++] }); while (j < m) res.push({ t: '+', s: b[j++] });
  return res;
}

/* ---------- scan filters ---------- */
function scanFilter(cv, mode) {
  if (mode === 'color') return cv;
  const ctx = cv.getContext('2d'), im = ctx.getImageData(0, 0, cv.width, cv.height), d = im.data;
  const hist = new Uint32Array(256), lum = new Uint8ClampedArray(d.length / 4);
  for (let i = 0, k = 0; i < d.length; i += 4, k++) { const l = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0; lum[k] = l; hist[l]++; }
  const total = lum.length; let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc > total * 0.02) { lo = v; break; } }
  acc = 0; for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc > total * 0.08) { hi = v; break; } }
  if (hi - lo < 20) { lo = 0; hi = 255; }
  let thr = 128;
  if (mode === 'bw') {
    let sum = 0; for (let v = 0; v < 256; v++) sum += v * hist[v];
    let sB = 0, wB = 0, best = 0;
    for (let v = 0; v < 256; v++) { wB += hist[v]; if (!wB) continue; const wF = total - wB; if (!wF) break; sB += v * hist[v]; const mB = sB / wB, mF = (sum - sB) / wF, between = wB * wF * (mB - mF) ** 2; if (between > best) { best = between; thr = v; } }
  }
  for (let k = 0, i = 0; k < lum.length; k++, i += 4) {
    let v = (lum[k] - lo) * 255 / (hi - lo);
    v = mode === 'bw' ? (lum[k] > thr ? 255 : 0) : clamp(v, 0, 255);
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ctx.putImageData(im, 0, 0);
  return cv;
}

      const summary = `<div class="sumrow"><span>Original: <b>${esc(A.name)}</b></span><span>New: <b>${esc(B.name)}</b></span></div><div class="sumrow"><span><b>${added}</b> lines added</span><span><b>${removed}</b> lines removed</span><span><b>${pages}</b> pages compared</span></div>`;
      c.ws.innerHTML = `<div class="notice">${summary}</div>${html}`;
      rep = `<!doctype html><html><head><meta charset="utf-8"><title>Comparison: ${esc(A.name)} vs ${esc(B.name)}</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:30px auto;padding:0 16px;color:#111}.diff{border:1px solid #ddd;border-radius:8px;margin:14px 0;overflow:hidden}.diff h4{margin:0;padding:8px 12px;background:#f2f3f5;display:flex;justify-content:space-between;font-size:13px}.diff p{margin:0;padding:3px 12px 3px 28px;font-size:13px;position:relative;white-space:pre-wrap}.a{background:#ddf2e3}.a::before{content:"+";position:absolute;left:10px}.r{background:#fadfdb;text-decoration:line-through}.r::before{content:"-";position:absolute;left:10px}.s{color:#777;font-style:italic}.sumrow{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}</style></head><body><h1>PDF comparison</h1>${summary}${html}</body></html>`;
      return [out(`comparison_${baseName(A.name)}_vs_${baseName(B.name)}.html`, rep, 'text/html', { note: `${added} added, ${removed} removed. Details shown on the left.` })];
    }
  })
];

/* =================================================================
   APP SHELL
   ================================================================= */
const state = { tool: null, files: [], extra: null, token: 0, busy: false, uid: 0 };
const app = $('#app');
const catOf = id => CATS.find(c => c.id === id);

function renderHome() {
  state.tool = null; state.token++;
  document.title = 'Hammer PDF';
  app.innerHTML = `<section class="intro"><div><h1>Every PDF job, done in your browser</h1><p>${TOOLS.length} tools to merge, convert, edit, sign and secure PDFs. Nothing is uploaded, so private documents stay private.</p></div><label class="search">${svg('search')}<input id="q" type="search" placeholder="Find a tool, e.g. sign" aria-label="Find a tool"></label></section><div id="racks"></div>`;
  const racks = $('#racks');
  const draw = q => {
    q = (q || '').trim().toLowerCase();
    let html = '';
    for (const cat of CATS) {
      const list = TOOLS.filter(t => t.cat === cat.id && (!q || (t.name + ' ' + t.desc).toLowerCase().includes(q)));
      if (!list.length) continue;
      html += `<section class="rack" style="--c:${cat.color}"><h2><i></i>${cat.name} <em>${list.length}</em></h2><div class="grid">${list.map(t => `<a class="tile" href="#${t.id}"><span class="ic">${t.icon}</span><span class="tx"><b>${t.name}</b><span>${t.desc}</span></span></a>`).join('')}</div></section>`;
    }
    racks.innerHTML = html || `<p class="empty-search">No tool matches "${esc(q)}". Try merge, sign, word or compress.</p>`;
  };
  draw('');
  $('#q').addEventListener('input', e => draw(e.target.value));
}

function openTool(t) {
  state.tool = t; state.files = []; state.extra = null; state.token++; state.busy = false;
  sig.src = null;
  document.title = `${t.name} · Hammer PDF`;
  const cat = catOf(t.cat);
  app.innerHTML = `<div style="--c:${cat.color}">
    <div class="toolhead"><a class="back" href="#">${svg('back', 'width="15" height="15"')}All tools</a><span class="ic">${t.icon}</span><h1>${t.name}</h1><p>${t.desc}</p></div>
    <div class="bench">
      <div class="work">
        <label class="drop" id="drop"><input type="file" id="fileinput" accept="${t.accept}"${t.multiple ? ' multiple' : ''}${t.capture ? ' capture="environment"' : ''}><span class="big">${svg('upload')}${t.dropText || `Choose ${t.acceptLabel}`}</span><small>or drop ${t.multiple ? 'files' : 'it'} here</small></label>
        <ul class="files" id="files"></ul>
        <div id="ws"></div>
      </div>
      <aside class="panel" aria-label="Settings">
        <h2>Settings</h2>
        <div style="display:flex;flex-direction:column;gap:14px" id="opts">${t.options ? t.options() : ''}</div>
        <button class="run" id="run" type="button">${t.action}</button>
        <div id="status" hidden></div>
        <div id="results" class="results"></div>
      </aside>
    </div></div>`;
  window.scrollTo(0, 0);
  const drop = $('#drop'), input = $('#fileinput');
  input.addEventListener('change', () => { addFiles(input.files); input.value = ''; });
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
  $('#opts').addEventListener('click', e => { const b = e.target.closest('.seg button'); if (!b) return; $$('button', b.parentNode).forEach(x => x.classList.toggle('on', x === b)); });
  $('#opts').addEventListener('input', e => { if (e.target.type === 'range') { const v = $('#' + e.target.id + '-v'); if (v) v.textContent = e.target.value + (e.target.dataset.unit || ''); } });
  $('#run').addEventListener('click', runTool);
  try { t.init && t.init(); } catch (e) { console.error(e); }
  renderFiles();
}

function acceptOk(t, f) {
  const n = f.name.toLowerCase(), type = (f.type || '').toLowerCase();
  return t.accept.split(',').map(s => s.trim().toLowerCase()).some(a => a.startsWith('.') ? n.endsWith(a) : a.endsWith('/*') ? type.startsWith(a.slice(0, -1)) : type === a);
}

async function addFiles(list) {
  const t = state.tool; if (!t || state.busy) return;
  const all = [...list], ok = all.filter(f => acceptOk(t, f));
  if (all.length > ok.length) toast(`Skipped ${all.length - ok.length} file${all.length - ok.length > 1 ? 's' : ''} that ${all.length - ok.length > 1 ? "aren't" : "isn't a"} ${t.acceptLabel}${all.length - ok.length > 1 ? 's' : ''}.`);
  if (!ok.length) return;
  const recs = ok.map(f => ({ id: ++state.uid, file: f, name: f.name, size: f.size }));
  if (t.multiple) state.files.push(...recs); else state.files = [recs[0]];
  if (t.max && state.files.length > t.max) state.files = state.files.slice(-t.max);
  clearResults(); renderFiles();
  if (t.onFiles) await prepWorkspace();
}

async function prepWorkspace() {
  const t = state.tool, ws = $('#ws'), token = state.token;
  state.extra = null;
  if (!state.files.length) { ws.innerHTML = ''; return; }
  try { await t.onFiles(ctx()); }
  catch (e) { console.error(e); if (token === state.token) ws.innerHTML = `<div class="err"><b>Couldn't open this file.</b> ${esc(e.message || e)}</div>`; }
}

function renderFiles() {
  const t = state.tool, ul = $('#files'), drop = $('#drop');
  drop.classList.toggle('compact', state.files.length > 0);
  $('.big', drop).lastChild.textContent = state.files.length ? (t.multiple ? 'Add more' : 'Choose a different file') : (t.dropText || `Choose ${t.acceptLabel}`);
  $('small', drop).textContent = state.files.length ? (t.multiple ? `${state.files.length} file${state.files.length > 1 ? 's' : ''} added` : '') : `or drop ${t.multiple ? 'files' : 'it'} here`;
  ul.innerHTML = state.files.map((f, i) => `<li><span class="fi">${esc((f.name.split('.').pop() || '').slice(0, 4))}</span><span class="fn" title="${esc(f.name)}">${t.multiple && state.files.length > 1 ? `<span class="mono" style="color:var(--muted)">${i + 1}. </span>` : ''}${esc(f.name)}</span><span class="sz mono">${fmtSize(f.size)}</span>${t.multiple ? `<button class="iconbtn" data-mv="-1" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">${svg('up')}</button><button class="iconbtn" data-mv="1" data-i="${i}" ${i === state.files.length - 1 ? 'disabled' : ''} aria-label="Move down">${svg('down')}</button>` : ''}<button class="iconbtn" data-rm="${i}" aria-label="Remove ${esc(f.name)}">${svg('x')}</button></li>`).join('');
  ul.onclick = e => {
    const b = e.target.closest('button'); if (!b || state.busy) return;
    if (b.dataset.rm != null) { state.files.splice(+b.dataset.rm, 1); clearResults(); renderFiles(); if (t.onFiles) { state.token++; prepWorkspace(); } return; }
    const i = +b.dataset.i, j = i + +b.dataset.mv; [state.files[i], state.files[j]] = [state.files[j], state.files[i]]; clearResults(); renderFiles();
  };
}

function ctx() {
  return { files: state.files, ws: $('#ws'), tool: state.tool, progress };
}
function progress(text, frac) {
  const s = $('#status'); if (!s) return;
  s.hidden = false;
  const indet = frac == null;
  s.innerHTML = `<div class="prog"><div class="bar"><i class="${indet ? 'indet' : ''}" style="width:${indet ? 35 : Math.round(clamp(frac, 0.03, 1) * 100)}%"></i></div><span>${esc(text)}</span></div>`;
}
function clearResults() { const r = $('#results'); if (r) r.innerHTML = ''; const s = $('#status'); if (s) s.hidden = true; }
function showError(msg) { const s = $('#status'); s.hidden = false; s.innerHTML = `<div class="err" role="alert"><b>Something needs fixing.</b> ${esc(msg)}</div>`; }

async function runTool() {
  const t = state.tool; if (!t || state.busy) return;
  const min = t.min ?? 1;
  if (state.files.length < min) { showError(min > 1 ? `Add at least ${min} files.` : `Choose a ${t.acceptLabel} first.`); return; }
  if (t.onFiles && state.files.length && !state.extra && t.id !== 'forms') { showError('The file is still loading. Wait a moment and try again.'); return; }
  const btn = $('#run'), token = state.token;
  state.busy = true; btn.disabled = true; clearResults(); progress('Starting…', null);
  try {
    const outs = await t.run(ctx());
    if (token !== state.token) return;
    $('#status').hidden = true;
    showResults(outs);
  } catch (e) {
    console.error(e);
    if (token === state.token) showError(e && e.message ? e.message : String(e));
  } finally {
    if (token === state.token) { state.busy = false; btn.disabled = false; }
  }
}

function showResults(outs) {
  const r = $('#results');
  const prev = outs.find(o => o.preview);
  r.innerHTML = `<h3>${svg('check')}${outs.length > 1 ? `${outs.length} files ready` : 'Your file is ready'}</h3><ul class="outs">${outs.map((o, i) => `<li><span class="on"><span class="fn" title="${esc(o.name)}">${esc(o.name)}</span><span class="sz mono">${fmtSize(o.blob.size)}</span>${o.note ? `<span class="note">${esc(o.note)}</span>` : ''}</span><button class="dl" type="button" data-dl="${i}">Download</button></li>`).join('')}</ul>${outs.length > 1 ? `<button class="run alt" type="button" id="dlall">Download all as ZIP</button>` : ''}${prev ? `<pre class="preview">${esc(prev.preview.slice(0, 6000))}${prev.preview.length > 6000 ? '\n…' : ''}</pre>` : ''}`;
  r.onclick = async e => {
    const b = e.target.closest('[data-dl]'); if (b) { const o = outs[+b.dataset.dl]; await saveFile(o.name, o.blob); return; }
    if (e.target.closest('#dlall')) {
      const btn = $('#dlall'); btn.disabled = true; btn.textContent = 'Zipping…';
      try { await need('jszip'); const z = new JSZip(); const used = {}; outs.forEach(o => { let n = o.name; if (used[n]) n = baseName(n) + `_${used[n]}` + n.slice(baseName(n).length); used[o.name] = (used[o.name] || 0) + 1; z.file(n, o.blob); }); const blob = await z.generateAsync({ type: 'blob' }); await saveFile(`hammer-pdf_${state.tool.id}.zip`, blob); }
      catch (err) { toast(err.message || 'Zipping failed.'); }
      finally { btn.disabled = false; btn.textContent = 'Download all as ZIP'; }
    }
  };
  if (window.matchMedia('(max-width: 880px)').matches) r.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const t = TOOLS.find(x => x.id === id);
  if (t) { if (state.tool !== t) openTool(t); } else renderHome();
}
window.addEventListener('hashchange', route);
route();
</script>

</body>
</html>
